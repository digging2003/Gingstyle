<!DOCTYPE html>
<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/default}">

<main layout:fragment="contents" class="cart-page my-5 px-0">
    <form action="/order" method="POST">

    <h4 class="m-4 d-flex align-items-center">장바구니</h4>

    <table class="table align-middle text-center border-top w-100">
        <thead class="border-bottom">
            <tr>
                <th><input type="checkbox" id="checkAll" class="form-check-input" checked></th>
                <th class="text-muted text-start ps-4">상품 정보</th>
                <th class="text-muted">수량</th>
                <th class="text-muted">주문금액</th>
                <th></th>
            </tr>
        </thead>

        <!-- 장바구니 비어있을 때 -->
        <tbody th:unless="${cartView != 'nothing'}">
            <tr>
                <td colspan="5" class="empty-cart text-center py-5">
                    <i class="bi bi-cart"></i>
                    <p class="mt-3">장바구니가 비어있습니다.</p>
                    <a href="/product" class="more-shoping text-decoration-underline">계속 쇼핑하기</a>
                </td>
            </tr>
        </tbody>

        <!-- 장바구니 상품 있을 때 -->
        <tbody th:if="${cartView != 'nothing'}">
            <tr class="cartView" th:each="cart : ${cartView}" th:data-productId="${cart.productId}" th:data-quantity="${cart.quantity}">
                <td class="text-start ps-4" style="width: 50px;">
                    <input name="cartId" th:value="${cart.cartId}" type="checkbox" class="form-check-input" checked>
                </td>
                <td class="text-start d-flex align-items-center">
                    <img th:src="${cart.mainImagePath}" alt="상품 이미지" height="100">
                    <span class="ms-3" th:text="${cart.name}">상품이름</span>
                </td>
                <td>
                    <div class="d-flex align-items-center justify-content-center mt-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm px-2 quantity-minus" 
                                th:data-user-id="${cart.userId}" th:data-product-id="${cart.productId}" th:disabled="${cart.quantity == 1}">-</button>
                        <span class="mx-2 quantity-count" th:text="${cart.quantity}">상품수량</span>
                        <button type="button" class="btn btn-outline-secondary btn-sm px-2 quantity-plus" 
                                th:data-user-id="${cart.userId}" th:data-product-id="${cart.productId}">+</button>
                    </div>
                </td>
                <td>
                    <p class="fw-bold" th:text="${#numbers.formatInteger(cart.totalPrice, 3, 'COMMA')} + '원'">상품가격</p>
                </td>
                <td>
                    <button type="button" class="deleteBtn btn btn-sm" th:value="${cart.productId}">
                        <i class="icon bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- 상품 있을 때 하단 영역 -->
    <div th:if="${cartView != 'nothing'}" class="px-4">
        <div class="fw-bold d-flex align-items-center justify-content-center px-2 my-4">
            <p>총 주문 금액   
            <span class="total-price" th:text="${#numbers.formatInteger(#aggregates.sum(cartView.![totalPrice]), 3, 'COMMA')} + '원'">총주문금액</span></p>
        </div>

        <div class="text-center mb-5">
            <button type="submit" id="orderBtn" class="btn btn-dark px-5 py-2">주문하기</button>
            <div class="mt-3">
                <a href="/product" class="more-shoping">계속 쇼핑하기</a>
            </div>
        </div>
    </div>
    </form>
</main>

<script layout:fragment="script">
$(function() {
	
	// 수량 증가
	$(".quantity-plus").on("click", function () {
	    const productId = $(this).data("product-id");

	    $.ajax({
	        type: "POST",
	        url: "/cart/add",
	        data: { productId: productId },
	        success: function (response) {
	            if (response.result === "success") {
	            	location.href = "";
	            } else {
	                alert("수량 증가 실패");
	            }
	        },
	        error: function () {
	            alert("에러 발생 (수량 증가)");
	        }
	    });
	});

	// 수량 감소
	$(".quantity-minus").on("click", function () {
	    const productId = $(this).data("product-id");

	    $.ajax({
	        type: "PUT",
	        url: "/cart/subtract",
	        data: { productId: productId },
	        success: function (response) {
	            if (response.result === "success") {
	            	location.href = "";
	            } else {
	                alert("수량 감소 실패");
	            }
	        },
	        error: function () {
	            alert("에러 발생 (수량 감소)");
	        }
	    });
	});
    
	$("#orderBtn").on("click", function (e) {
	    const checkedCartIds = $("input[name='cartId']:checked");

	    if (checkedCartIds.length === 0) {
	        e.preventDefault();
	        alert("주문할 상품을 선택해주세요.");
	        return;
	    }

	    // 폼 전송 직전에만 체크 안된 항목을 disable
	    $("input[name='cartId']").not(":checked").prop("disabled", true);
	});


    // 장바구니 상품 삭제
    $(".deleteBtn").on("click", function() {
        let productId = $(this).val();
        
        $.ajax({
            type:"delete"
            , url:"/cart/delete"
            , data:{"productId":productId}
            , success:function(response) {
                if(response.result == "success") {
                    alert("장바구니 상품이 삭제되었습니다.");
                    location.href = "";
                } else {
                    alert("장바구니 삭제 실패!!");
                }
            }
            , error:function() {
                alert("장바구니 삭제 에러!!");
            }
        });
    });

    // 전체 선택 체크박스 제어
    $("#checkAll").on("change", function () {
        $(".cartView input[type='checkbox']").prop("checked", this.checked);
        updateTotalPrice(); // 선택 항목 금액 업데이트
    });

    // 개별 체크박스 변경 시 전체선택 상태도 변경
    $(".cartView input[type='checkbox']").on("change", function () {
        let totalCheckbox = $(".cartView input[type='checkbox']").length;
        let checkedCheckbox = $(".cartView input[type='checkbox']:checked").length;

        $("#checkAll").prop("checked", totalCheckbox === checkedCheckbox);
        updateTotalPrice(); // 선택 항목 금액 업데이트
    });

    // 선택된 항목의 총 금액 계산 함수
    function updateTotalPrice() {
        let total = 0;

        $(".cartView").each(function () {
            let checkbox = $(this).find("input[type='checkbox']");

            if (checkbox.is(":checked")) {
                let priceText = $(this).find("td").eq(5).text(); // 상품금액 셀 (₩12,000 등)
                let price = parseInt(priceText.replace(/[^\d]/g, '')); // ₩, , 제거하고 숫자만 추출
                total += price;
            }
        });

        // 총액 업데이트
        $("#selectedTotal").text("₩" + total.toLocaleString());
    }

    // 페이지 로드 시 초기 총액 계산
    updateTotalPrice();
});
</script>
</html>
